services:
  dukecam:
    build: .
    container_name: dukecam
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "4010:4010"
    environment:
      # Prefer values from .env; these are non-secret defaults only.
      - STORAGE_PATH=${STORAGE_PATH:-/data/photos}
      - THUMB_PATH=${THUMB_PATH:-/data/thumbs}
      - BASE_URL=${BASE_URL:-https://dukecam.thomasduke.io}
      - MAX_UPLOAD_MB=${MAX_UPLOAD_MB:-50}
      - PORT=${PORT:-4010}
      - FYXT_URL=${FYXT_URL:-https://open.apifyxt.com}
      - FYXT_API_KEY=${FYXT_API_KEY:-}
      - FYXT_SCHEMA=${FYXT_SCHEMA:-thomasduke}
      - PROPERTYOS_URL=${PROPERTYOS_URL:-}
      - PROPERTYOS_TOKEN=${PROPERTYOS_TOKEN:-}
      - POS_DB_URL=${POS_DB_URL:-}
      - DUKECAM_INGEST_TOKEN=${DUKECAM_INGEST_TOKEN:-}
      # DATABASE_URL must be set in .env (host-reachable Postgres).
      - DATABASE_URL=${DATABASE_URL}
    volumes:
      # Local disk ONLY — never NFS for photo storage.
      - /opt/apps/dukecam/data:/data
